<!-- Main purpose: let the administrator update the current admin username and password directly. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin/admin.css') }}">
</head>
<body>
    <main class="admin-form-page">
        <header class="admin-form-header">
            <div class="admin-settings-header">
                <div class="admin-settings-intro">
                    <h1>Set Up</h1>
                    <p>Update the login here directly. Enter the current password before saving changes.</p>
                </div>
                <a class="secondary-link dashboard-link" href="{{ url_for('admin.dashboard') }}">Back to Dashboard</a>
            </div>
        </header>

        {% if success_message %}
            <p class="success-message">{{ success_message }}</p>
        {% endif %}
        {% if error_message %}
            <p class="admin-form-error">{{ error_message }}</p>
        {% endif %}

        <section class="password-management-section">
            <form method="POST" class="admin-login-form password-account-card">
                <div>
                    <label for="current_username">Current Username</label>
                    <input id="current_username" type="text" value="{{ current_username }}" disabled>
                </div>
                <div>
                    <label for="new_username">New Username</label>
                    <input id="new_username" name="new_username" type="text" placeholder="Leave unchanged to keep the current username" autocomplete="username">
                </div>
                <div>
                    <label for="current_password">Current Password</label>
                    <input id="current_password" name="current_password" type="password" required autocomplete="current-password">
                </div>
                <div>
                    <label for="new_password">New Password</label>
                    <input id="new_password" name="new_password" type="password" minlength="8" autocomplete="new-password">
                    <p class="admin-form-hint">Use at least 8 characters if you want to change the password.</p>
                </div>
                <div>
                    <label for="confirm_password">Confirm New Password</label>
                    <input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password">
                </div>
                <button class="password-reset-button" type="submit">Save Login</button>
            </form>
        </section>
    </main>
</body>
</html>
